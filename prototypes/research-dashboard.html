<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIIV · Research dashboard concept</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#242b34;background:#f6f7f9;font-synthesis:none;--red:#b52632;--muted:#737c89;--line:#e4e7ec}
*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:4px}button{cursor:pointer}button{border:1px solid var(--line);border-radius:8px;padding:10px 15px;background:white;color:inherit;font-size:13px;font-weight:600}button:hover{background:#f4f5f7}button.primary{background:var(--red);color:white;border-color:var(--red)}button.quiet{background:transparent;border-color:transparent;color:var(--muted)}button.danger{color:var(--red)}button:disabled{opacity:.45;cursor:default}a{color:var(--red)}
.shell{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column;gap:34px}.brand{font-size:29px;font-weight:850;color:var(--red);letter-spacing:-1px}.brand small{display:block;font-size:11px;letter-spacing:1.5px;color:var(--muted);font-weight:600;margin-top:7px}.nav-label,.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}nav{display:grid;gap:7px;margin-top:13px}nav button{text-align:left;border:0;color:#626c79;padding:13px}nav button.active{color:var(--red);background:#fcf0f1}.nav-icon{display:inline-block;width:26px;font-size:16px}.side-note{margin-top:auto;border-top:1px solid var(--line);padding-top:20px;font-size:12px;color:var(--muted);line-height:1.7}.side-note strong{color:#454d58}.workspace{min-width:0}.topbar{min-height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:16px 40px;gap:16px}.topbar p{font-size:13px;color:#626c79;margin:0}.badge{font-size:11px;font-weight:650;padding:5px 9px;border-radius:5px;background:#f0f2f5;color:#687281;display:inline-block}.badge.green{color:#397259;background:#edf6f0}.badge.red{color:#aa3743;background:#faedef}.avatar{height:31px;width:31px;background:#f9e9eb;color:var(--red);display:inline-grid;place-items:center;border-radius:50%;font-size:11px;font-weight:700}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.content{padding:36px 40px;max-width:1450px;margin:auto}.notice{font-size:12px;color:#856631;background:#fffbf2;border:1px solid #f0e4c9;border-radius:8px;padding:11px 15px;margin-bottom:28px;line-height:1.6}h1{font-size:29px;letter-spacing:-.8px;margin:6px 0 9px}h2{font-size:18px;margin:0 0 8px;letter-spacing:-.3px}h3{font-size:15px;margin:0 0 7px}p{line-height:1.65}.muted{color:var(--muted);font-size:13px}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:27px}.heading p{margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.stat{background:white;border:1px solid var(--line);border-radius:10px;padding:20px 23px}.stat strong{font-size:27px;margin-right:9px}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:27px 0 18px}.search{max-width:330px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px}.card{border:1px solid var(--line);background:white;border-radius:11px;overflow:hidden;display:flex;flex-direction:column}.card-top{height:6px;background:#bf6e77}.card:nth-child(2n) .card-top{background:#7a8d9b}.card-body{padding:24px;flex:1}.card h2{font-size:18px;line-height:1.45;margin:17px 0 9px}.card p{font-size:13px;color:var(--muted);margin:0 0 20px}.card-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #f0f1f4;padding:14px 22px;gap:12px}.meta{font-size:12px;color:#66717e;display:flex;gap:16px;flex-wrap:wrap}.tabs{display:flex;gap:25px;border-bottom:1px solid var(--line);margin:27px 0}.tabs button{border:0;border-radius:0;background:none;padding:13px 1px;color:var(--muted)}.tabs button.active{color:var(--red);border-bottom:2px solid var(--red)}.editor-layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:24px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:26px}.panel p{margin-top:0}.field{display:block;margin-top:20px;font-size:12px;font-weight:650}.field:first-child{margin-top:0}.field small{display:block;color:var(--muted);font-weight:400;line-height:1.5;margin-top:6px}input:not([type=checkbox]),textarea,select{width:100%;border:1px solid #d9dfe6;border-radius:7px;background:white;color:#26313c;padding:11px 12px;margin-top:8px;font-size:13px}textarea{resize:vertical;line-height:1.7;min-height:110px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.help-list{padding-left:19px;color:#687281;font-size:12px;line-height:2}.paper-row{display:flex;justify-content:space-between;align-items:start;padding:19px 0;border-bottom:1px solid var(--line);gap:20px}.paper-row:last-child{border-bottom:0}.paper-row h3{line-height:1.5;font-size:14px}.paper-row p{font-size:12px;color:var(--muted);margin:5px 0}.paper-row .actions{flex-shrink:0}.person{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f0f1f4}.person span:nth-child(2){flex:1}.person small{display:block;color:var(--muted);font-size:11px;margin-top:5px}input[type=checkbox]{accent-color:var(--red);width:17px;height:17px}.empty{padding:25px;color:var(--muted);font-size:13px;text-align:center}.crumb{background:none;border:0;padding:0;color:var(--muted);margin-bottom:20px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#28333e;color:white;padding:13px 22px;border-radius:9px;box-shadow:0 8px 35px #0002;z-index:5;font-size:13px;max-width:90vw}.toast:empty{display:none}dialog{border:1px solid var(--line);border-radius:13px;max-width:760px;width:calc(100% - 36px);padding:30px;max-height:88vh;box-shadow:0 20px 80px #0002}dialog::backdrop{background:#17212e70;backdrop-filter:blur(3px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}.preview-hero{padding:30px;background:#fbf3f4;border-radius:8px;margin-bottom:22px}.preview-hero h1{font-size:27px}.preview-image{width:100%;max-height:280px;object-fit:contain;margin-bottom:22px}.space{margin-top:22px}.row-title{display:flex;align-items:center;justify-content:space-between;gap:16px}.preview-text{white-space:pre-wrap}.wide{grid-column:1/-1}
@media(max-width:1000px){.shell{grid-template-columns:185px minmax(0,1fr)}.content{padding:25px}.topbar{padding:15px 25px}.editor-layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.sidebar{padding:25px 14px}}@media(max-width:650px){.shell{display:block}.sidebar{padding:16px;gap:13px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:23px}.brand small,.nav-label,.side-note{display:none}nav{display:flex;margin:0}nav button{padding:10px}.content{padding:20px 16px}.topbar{padding:13px 16px}.heading{align-items:flex-start;flex-direction:column}.stats{gap:8px}.stat{padding:14px 10px}.stat strong{display:block;font-size:23px}.tabs{gap:20px;overflow:auto}.two{grid-template-columns:1fr}.paper-row{flex-direction:column}.panel{padding:20px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="shell">
 <aside class="sidebar"><div class="brand">niiv<span style="color:#343c47">.</span><small>CONTENT WORKSPACE</small></div><div><div class="nav-label">Manage website</div><nav id="nav"></nav></div><div class="side-note"><strong>One shared workspace</strong><br>Everyone uses the same editing screens.<br><br>Research groups the story.<br>Papers describe the work.<br>People receive the credit.<br><button class="quiet" onclick="resetDemo()">Reset mockup</button></div></aside>
 <div class="workspace"><header class="topbar"><p>NIIV Lab <span style="margin:0 9px;color:#c2c7cd">/</span> Website content</p><div class="actions"><span class="badge">INTERACTIVE MOCKUP</span><span class="avatar" aria-label="Lab workspace">NL</span></div></header><main class="content" id="app"></main></div>
</div>
<dialog id="modal"></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="research-dashboard-data.js"></script>
<script>
const KEY='niiv-research-dashboard-concept-v1';
const clone=x=>JSON.parse(JSON.stringify(x));
let state=clone(window.NIIV_SEED);try{const saved=localStorage.getItem(KEY);if(saved)state=JSON.parse(saved)}catch{}
let view='research', selected=null, tab='overview', query='', dirty=false;
const app=document.querySelector('#app'),modal=document.querySelector('#modal');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeURL=x=>{try{const u=new URL(x,location.href);return ['http:','https:','file:'].includes(u.protocol)?u.href:''}catch{return ''}};
const project=()=>state.projects.find(p=>p.slug===selected);
const paper=id=>state.papers.find(p=>p.id===id);
const linked=p=>p.publications.map(x=>paper(x.publicationId)).filter(Boolean);
const notice='<div class="notice">Design mockup using a copy of your website content. Edits stay in this browser when saved; nothing is published to the website. Team selections and content statuses are illustrative.</div>';
const initials=name=>name.split(' ').filter(Boolean).map(x=>x[0]).slice(0,2).join('');
function toast(message){document.querySelector('#toast').textContent=message;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',4200)}
function mark(){dirty=true;const s=document.querySelector('#save');if(s)s.textContent='Save draft •'}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));dirty=false;toast('Draft saved in this browser. The live website has not changed.');render()}catch{toast('Browser storage is unavailable. Changes will last only until you close or reload this page.')}}
function resetDemo(){if(!confirm('Reset only this mockup’s edits to the original sample content?'))return;try{localStorage.removeItem(KEY)}catch{}state=clone(window.NIIV_SEED);selected=null;dirty=false;render();toast('Mockup reset.')}
function go(next){view=next;selected=null;query='';render()}
function openProject(id){selected=id;tab='overview';render();window.scrollTo(0,0)}
function field(label,key,value,large=false,hint=''){return `<label class="field">${label}${large?`<textarea data-field="${key}" rows="${key==='overview'?7:3}">${esc(value)}</textarea>`:`<input data-field="${key}" value="${esc(value)}">`}${hint?`<small>${hint}</small>`:''}</label>`}
function render(){
 document.querySelector('#nav').innerHTML=[['research','▦','Research'],['papers','▤','Papers'],['people','♧','People']].map(([id,icon,label])=>`<button data-view="${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}><span class="nav-icon">${icon}</span>${label}</button>`).join('');
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));
 if(selected){renderEditor();return}
 if(view==='research')renderResearch();else if(view==='papers')renderPapers();else renderPeople();
}
function renderResearch(){
 const projects=state.projects.filter(p=>!p.archived);
 app.innerHTML=notice+`<div class="heading"><div><div class="eyebrow">The bigger picture</div><h1>Research areas & projects</h1><p class="muted">Tell the research story, connect its papers, and credit the people behind it.</p></div><button class="primary" onclick="addProject()">＋ Add research / project</button></div><div class="stats"><div class="stat"><strong>${projects.length}</strong><span>Research areas / projects</span></div><div class="stat"><strong>${new Set(projects.flatMap(p=>p.publications.map(x=>x.publicationId))).size}</strong><span>Connected papers</span></div><div class="stat"><strong>${projects.filter(p=>!p.team.length).length}</strong><span>Need team details</span></div></div><div class="toolbar"><h2>Your research</h2><input class="search" id="search" aria-label="Search research" placeholder="Search areas or projects…" value="${esc(query)}"></div><div class="grid" id="cards"></div><p class="muted space">A research area or project groups related papers. A paper can belong to more than one group.</p>`;
 const draw=()=>{document.querySelector('#cards').innerHTML=projects.filter(p=>(p.title+' '+p.description).toLowerCase().includes(query.toLowerCase())).map(p=>`<article class="card"><div class="card-top"></div><div class="card-body"><div class="actions"><span class="badge">${esc(p.kind)}</span><span class="badge ${p.team.length?'green':'red'}">${p.team.length?'Team added':'Add team details'}</span></div><h2>${esc(p.title)}</h2><p>${esc(p.description||'Add a short introduction to this research.')}</p><div class="meta"><span>▤ ${linked(p).length} papers</span><span>♧ ${p.team.length} team members selected</span></div></div><div class="card-footer"><span class="muted">${esc(p.status)}</span><button data-open="${esc(p.slug)}">Edit research →</button></div></article>`).join('')||'<p class="empty wide">No matching research. Try a different search.</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openProject(b.dataset.open))};
 draw();document.querySelector('#search').oninput=e=>{query=e.target.value;draw()};
}
function renderEditor(){const p=project();
 app.innerHTML=notice+`<button class="crumb" onclick="go('research')">← All research areas & projects</button><div class="heading"><div><div class="eyebrow">${esc(p.kind)}</div><h1>${esc(p.title||'Untitled research')}</h1><p class="muted">One place for the big picture, related papers, and everyone involved.</p></div><div class="actions"><button onclick="preview()">Preview public page</button><button class="primary" id="save" onclick="save()">Save draft${dirty?' •':''}</button></div></div><div class="tabs" aria-label="Editing sections">${[['overview','Overview'],['papers',`Papers (${linked(p).length})`],['team','People involved'],['materials','Images & links']].map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}" ${tab===id?'aria-current="page"':''}>${label}</button>`).join('')}</div><div class="editor-layout"><section class="panel" id="editor"></section><aside class="panel"><div class="eyebrow">How this fits together</div><h3 style="margin-top:15px">${esc(p.title||'Research / project')}</h3><p class="muted">The high-level story shown on the Research page.</p><p class="muted">↳ <strong>${linked(p).length} related papers</strong><br>Each has its own title, authors, venue, and links.</p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Before sharing</h3><ul class="help-list"><li>${p.description?'✓':'○'} Short summary</li><li>${p.overview?'✓':'○'} Research overview</li><li>${p.team.length?'✓':'○'} People involved</li><li>${linked(p).length?'✓':'○'} Related papers</li></ul><p class="muted">These are completeness reminders, not permissions or approval steps.</p><button class="danger space" onclick="archiveProject()">Archive this research</button></aside></div>`;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 const editor=document.querySelector('#editor');
 if(tab==='overview')editor.innerHTML=`<h2>The research story</h2><p class="muted">Explain the larger question that connects this body of work.</p>${field('Title','title',p.title)}<div class="two"><label class="field">Type<select data-field="kind">${['Research area','Project'].map(k=>`<option ${p.kind===k?'selected':''}>${k}</option>`).join('')}</select><small>Choose the label that fits. Both can contain papers.</small></label><label class="field">Research status<select data-field="status">${['Not specified','Ongoing','Completed'].map(k=>`<option ${p.status===k?'selected':''}>${k}</option>`).join('')}</select></label></div>${field('Short summary','description',p.description,true,'Appears on the research card and at the top of its page.')}${field('Full overview','overview',p.overview,true,'Describe the research question, approach, and outcomes. You can complete this over time.')}${field('Topics','tags',p.tags.join(', '),false,'Separate topics with commas, for example: Explainable AI, Visual Analytics.')}`;
 if(tab==='papers'){editor.innerHTML=`<div class="row-title"><div><h2>Papers in this research</h2><p class="muted">Connect existing papers or add a new publication.</p></div><button onclick="editPaper()">＋ New paper</button></div><div class="actions space"><select id="paper-picker" aria-label="Select existing paper" style="flex:1;min-width:180px"><option value="">Choose an existing paper…</option>${state.papers.filter(x=>!p.publications.some(y=>y.publicationId===x.id)).map(x=>`<option value="${esc(x.id)}">${esc(x.title)} (${x.year})</option>`).join('')}</select><button onclick="connectPaper()">Connect paper</button></div><div class="space">${linked(p).map(x=>paperRow(x,true)).join('')||'<p class="empty">No papers connected yet.</p>'}</div>`;bindPapers()}
 if(tab==='team'){editor.innerHTML=`<h2>Who worked on this research?</h2><p class="muted">Select lab members who contributed to the broader research. Paper authors stay attached to their individual papers.</p><p class="notice">Existing project files do not record a team. No project memberships have been assumed in this mockup.</p>${state.people.map(x=>`<label class="person"><span class="avatar">${esc(x.initials||initials(x.name))}</span><span>${esc(x.name)}<small>${esc(x.role)}</small></span><input type="checkbox" data-person="${esc(x.name)}" ${p.team.includes(x.name)?'checked':''} aria-label="Include ${esc(x.name)}"></label>`).join('')}${field('External collaborators','collaborators',p.collaborators,true,'Names and affiliations, one person per line. The finished system would store these as individual people.')}`;document.querySelectorAll('[data-person]').forEach(c=>c.onchange=()=>{p.team=c.checked?[...p.team,c.dataset.person]:p.team.filter(n=>n!==c.dataset.person);mark()})}
 if(tab==='materials')editor.innerHTML=`<h2>Images & supporting links</h2><p class="muted">Give visitors a visual introduction and a way to explore further.</p>${field('Cover image path or URL','image',p.image,false,'The finished dashboard would include an upload button here.')}${field('Image description','imageAlt',p.imageAlt,false,'Describe the image for people using a screen reader.')}${field('Project website or demo URL','website',p.website)}${field('Code repository URL','code',p.code)}<p class="muted space">Paper-specific PDFs, DOI links, and code belong in each paper’s form.</p>`;
 document.querySelectorAll('[data-field]').forEach(input=>input.oninput=()=>{p[input.dataset.field]=input.dataset.field==='tags'?input.value.split(',').map(s=>s.trim()).filter(Boolean):input.value;mark()});
}
function paperRow(p,inside=false){return `<div class="paper-row"><div><span class="eyebrow">${esc(p.year)} · ${esc(p.tags?.[0]||'Publication')}</span><h3 style="margin-top:8px">${esc(p.title)}</h3><p>${esc(p.authors)}</p><p>${esc(p.venue)}</p></div><div class="actions"><button data-edit-paper="${esc(p.id)}">Edit</button>${inside?`<button class="quiet" data-unlink="${esc(p.id)}" aria-label="Disconnect ${esc(p.title)}">Disconnect</button>`:''}</div></div>`}
function bindPapers(){document.querySelectorAll('[data-edit-paper]').forEach(b=>b.onclick=()=>editPaper(b.dataset.editPaper));document.querySelectorAll('[data-unlink]').forEach(b=>b.onclick=()=>{project().publications=project().publications.filter(x=>x.publicationId!==b.dataset.unlink);mark();render();toast('Disconnected from this research. The paper still exists in Papers.')})}
function connectPaper(){const id=document.querySelector('#paper-picker').value;if(!id){toast('Choose a paper first.');return}project().publications.push({publicationId:id});mark();render();toast('Paper connected. Its details are shared across the website.')}
function renderPapers(){app.innerHTML=notice+`<div class="heading"><div><div class="eyebrow">Individual contributions</div><h1>Papers</h1><p class="muted">Maintain a paper once and connect it to one or more research areas.</p></div><div class="actions"><button onclick="save()">Save draft</button><button class="primary" onclick="editPaper()">＋ Add paper</button></div></div><input id="search" class="search" aria-label="Search papers" placeholder="Search papers or authors…" value="${esc(query)}"><div class="panel space" id="paper-list"></div>`;const draw=()=>{document.querySelector('#paper-list').innerHTML=state.papers.filter(p=>(p.title+' '+p.authors).toLowerCase().includes(query.toLowerCase())).map(p=>paperRow(p)).join('')||'<p class="empty">No matching papers.</p>';bindPapers()};draw();document.querySelector('#search').oninput=e=>{query=e.target.value;draw()}}
function renderPeople(){app.innerHTML=notice+`<div class="heading"><div><div class="eyebrow">A shared directory</div><h1>People</h1><p class="muted">Profiles are reused when selecting a research team. Former members keep their credit.</p></div></div><div class="panel">${state.people.map(p=>`<div class="person"><span class="avatar">${esc(p.initials||initials(p.name))}</span><span><strong>${esc(p.name)}</strong><small>${esc(p.role)}</small></span><span class="badge">${state.projects.filter(x=>!x.archived&&x.team.includes(p.name)).length} research groups selected</span></div>`).join('')}</div><p class="muted space">Profile editing is outside this project-focused mockup.</p>`}
function showModal(html){modal.innerHTML=html;if(!modal.open)modal.showModal()}
function editPaper(id){const existing=id?paper(id):null;const p=existing||{title:'',authors:'',year:new Date().getFullYear(),venue:'',links:{},abstract:''};showModal(`<div class="dialog-head"><div><div class="eyebrow">${existing?'Edit publication':'Add publication'}</div><h2 style="margin-top:6px">Paper details</h2></div><button onclick="modal.close()" aria-label="Close paper editor">✕</button></div><p class="muted">${existing?'Changes apply everywhere this paper is connected.':selected?'This paper will also be connected to the research you are editing.':'Add the paper here, then connect it from a research page.'}</p><form id="paper-form"><label class="field">Paper title<input name="title" required value="${esc(p.title)}"></label><label class="field">Authors, in publication order<textarea name="authors" required rows="2">${esc(p.authors)}</textarea></label><div class="two"><label class="field">Year<input name="year" type="number" required min="1900" max="2100" value="${p.year}"></label><label class="field">Venue<input name="venue" value="${esc(p.venue)}"></label></div><label class="field">Abstract<textarea name="abstract">${esc(p.abstract)}</textarea></label><div class="two"><label class="field">DOI link<input name="doi" type="url" value="${esc(p.links?.doi)}" placeholder="https://doi.org/…"></label><label class="field">PDF link or file path<input name="pdf" value="${esc(p.links?.pdf)}"></label></div><div class="actions space"><button type="submit" class="primary">Apply to draft</button><button type="button" onclick="modal.close()">Cancel</button></div><p class="muted">Use Save draft afterward to keep changes in this browser.</p></form>`);document.querySelector('#paper-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const updated={...p,id:existing?.id||'paper-'+Date.now(),title:f.get('title').trim(),authors:f.get('authors').trim(),year:Number(f.get('year')),venue:f.get('venue'),abstract:f.get('abstract'),tags:p.tags||[],links:{...p.links,doi:f.get('doi'),pdf:f.get('pdf')}};if(!updated.title||!updated.authors){toast('Add a title and authors before saving.');return}if(existing)Object.assign(existing,updated);else{state.papers.unshift(updated);if(selected)project().publications.unshift({publicationId:updated.id})}mark();modal.close();render();toast('Paper updated in the working draft.')};}
function addProject(){showModal(`<div class="dialog-head"><h2>Add research / project</h2><button onclick="modal.close()" aria-label="Close new research form">✕</button></div><p class="muted">Start with the high-level topic. You can connect papers and add people afterward.</p><form id="new-project"><label class="field">Title<input name="title" required placeholder="What is this body of work called?"></label><label class="field">Type<select name="kind"><option>Research area</option><option>Project</option></select></label><button class="primary space" type="submit">Create draft</button></form>`);document.querySelector('#new-project').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),title=f.get('title').trim();if(!title)return;const slug='research-'+Date.now();state.projects.unshift({slug,title,kind:f.get('kind'),description:'',overview:'',tags:[],publications:[],team:[],collaborators:'',status:'Not specified',image:'',imageAlt:'',website:'',code:''});mark();modal.close();openProject(slug)}}
function archiveProject(){if(!confirm('Archive this research in the mockup? Its papers and people will remain available. Reset mockup restores the sample.'))return;project().archived=true;mark();go('research');toast('Research archived in the mockup. Save draft to keep this change.')}
function preview(){const p=project();showModal(`<div class="dialog-head"><div><div class="eyebrow">Public page preview</div><p class="muted" style="margin:4px 0 0">A simplified preview of your current draft.</p></div><button onclick="modal.close()" aria-label="Close public preview">✕</button></div><div class="preview-hero"><span class="eyebrow">${esc(p.kind)}</span><h1>${esc(p.title)}</h1><p>${esc(p.description)}</p><div class="actions">${p.tags.map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div></div><h2>About this research</h2><p class="muted preview-text">${esc(p.overview||'Add an overview to tell the research story.')}</p><h2 class="space">People involved</h2><p class="muted">${p.team.length?p.team.map(esc).join(' · '):'Team details have not been added yet.'}</p>${p.collaborators?`<p class="muted preview-text">${esc(p.collaborators)}</p>`:''}<h2 class="space">Related papers</h2>${linked(p).map(x=>`<div class="paper-row"><div><h3>${esc(x.title)}</h3><p>${esc(x.authors)}</p><p>${esc(x.venue)} · ${x.year}</p></div></div>`).join('')||'<p class="muted">No papers connected yet.</p>'}<div class="notice space">In the finished dashboard, Publish changes would update the website after the build succeeds. This mockup only previews the content.</div>`)}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
render();
</script>
</body>
</html>
